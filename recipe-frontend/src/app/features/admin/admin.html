<div class="admin-container">
  <div class="admin-header">
    <h1>Administracija šifarnika i sistema</h1>
    <p>Upravljanje tipovima obroka, tipovima jela, tipovima ishrane, kategorijama namirnica i alergenima.</p>
  </div>

  <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedIndexChange)="onTabChange($event)">
    <mat-tab *ngFor="let tab of tabs" [label]="tab.label"></mat-tab>
  </mat-tab-group>

  <div class="table-toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Pretraga po nazivu ili ID-u</mat-label>
      <input matInput [value]="filterValue" (keyup)="applyFilter($event)" placeholder="Unesite pojam za pretragu..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Dodaj {{ currentTab.singularLabel }}
    </button>
  </div>

  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Naziv</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Akcije</th>
        <td mat-cell *matCellDef="let row" class="actions-col">
          <button mat-icon-button color="primary" title="Izmeni" (click)="openEditDialog(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" title="Obriši" (click)="deleteItem(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="3">
          Nema pronađenih stavki za zadati kriterijum.
        </td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
