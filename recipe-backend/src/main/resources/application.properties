spring.application.name=recipes-backend
server.port=8080

# Konekcija sa PostgreSQL bazom
spring.datasource.url=jdbc:postgresql://localhost:5432/recipes_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate podesavanja
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Autentifikacija (JWT)
# JWT_SECRET: najmanje 32 karaktera. Podrazumevana vrednost je SAMO za lokalni razvoj,
# u produkciji obavezno postavi promenljivu okruzenja JWT_SECRET.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-production-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Adresa Angular aplikacije (CORS i linkovi u mejlovima) i javna adresa ovog backenda (URL slika)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Upload slika profila
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ---------------------------------------------------------------------------
# E-posta (aktivacija naloga, reset lozinke)
# Dok SMTP nije podesen (nema spring.mail.host), mejlovi se NE salju, a tekst sa linkom se ispisuje u logu backenda.
# SMTP se ukljucuje promenljivama okruzenja (ili dodavanjem spring.mail.host=... ovde), na primer za Gmail:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=tvoj@gmail.com  SPRING_MAIL_PASSWORD=<app password>  MAIL_FROM=tvoj@gmail.com
# Napomena: spring.mail.host se namerno NE navodi ovde ni kao prazna vrednost, jer bi i prazna vrednost ukljucila SMTP.
# ---------------------------------------------------------------------------
app.mail.from=${MAIL_FROM:no-reply@recipes.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000